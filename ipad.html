<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPad・Mac版モック</title>
<style>
  :root{
    --bg:#FDFDFB; --surface:#FFFFFF; --surface-hover:#F6F8F9; --surface-active:#EEF2F4;
    --border:#E3E8EB; --text:#16181A; --text2:#5A6672; --text3:#A6B0B9;
    --primary:#0EA5E9; --primary-soft:#E0F2FE; --primary-deep:#075985;
    --shadow-sm:0 1px 4px rgba(28,25,23,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    height:100vh;height:100dvh;overflow:hidden;
  }
  .app{display:flex;height:100%;}

  .side{
    width:200px;flex:none;background:var(--bg);
    border-right:0.5px solid rgba(28,25,23,0.08);
    padding:24px 12px;display:flex;flex-direction:column;gap:4px;
  }
  .brand{font-size:11px;font-weight:500;letter-spacing:0.3em;color:var(--text3);padding:0 12px 20px;}
  .nav{
    display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;
    border:none;background:transparent;border-radius:8px;font-family:inherit;font-size:14px;
    color:var(--text2);cursor:pointer;text-align:left;
    transition:background 120ms cubic-bezier(.2,0,0,1),color 120ms;
  }
  .nav:hover{background:var(--surface-hover);}
  .nav.on{background:var(--primary-soft);color:var(--primary-deep);}
  .nav svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .nav.dim{color:var(--text3);cursor:default;}
  .nav.dim:hover{background:transparent;}
  .sidenote{margin-top:auto;font-size:11px;color:var(--text3);line-height:1.7;padding:0 12px;letter-spacing:0.02em;}

  .list{
    width:320px;flex:none;border-right:0.5px solid rgba(28,25,23,0.08);
    display:flex;flex-direction:column;background:var(--bg);
  }
  .listhead{padding:24px 20px 12px;flex:none;}
  .ltitle{font-size:22px;font-weight:600;letter-spacing:0.02em;line-height:1.45;}
  .lsub{font-size:12px;color:var(--text2);margin-top:4px;letter-spacing:0.02em;}
  .search{
    width:100%;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
    padding:0 12px;font-family:inherit;font-size:14px;color:var(--text);outline:none;margin-top:16px;
    transition:border-color 120ms,box-shadow 120ms;
  }
  .search:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,165,233,0.2);}
  .search::placeholder{color:var(--text3);}
  .listbody{flex:1;overflow-y:auto;padding:0 12px 24px;}
  .group{font-size:11px;font-weight:500;letter-spacing:0.06em;color:var(--text2);padding:16px 8px 8px;}
  .item{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px;border:none;background:transparent;border-radius:8px;
    font-family:inherit;text-align:left;cursor:pointer;
    transition:background 120ms cubic-bezier(.2,0,0,1);
  }
  .item:hover{background:var(--surface-hover);}
  .item.on{background:var(--primary-soft);}
  .item > div:first-child{min-width:0;}
  .iname{font-size:14px;color:var(--text);letter-spacing:0.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item.on .iname{color:var(--primary-deep);}
  .imeta{font-size:12px;color:var(--text2);margin-top:3px;letter-spacing:0.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tag{
    font-size:11px;font-weight:500;letter-spacing:0.06em;padding:2px 8px;border-radius:4px;
    background:var(--surface-active);color:var(--text2);white-space:nowrap;flex:none;
  }
  .empty{padding:32px 12px;text-align:center;font-size:14px;color:var(--text3);line-height:1.8;}

  .detail{flex:1;overflow-y:auto;padding:40px;background:var(--bg);}
  .dwrap{max-width:760px;}
  .name-big{font-size:28px;font-weight:600;letter-spacing:0.02em;line-height:1.4;}
  .name-sub{font-size:14px;color:var(--text2);margin-top:8px;letter-spacing:0.01em;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .chip{font-size:11px;font-weight:500;letter-spacing:0.06em;padding:4px 8px;border-radius:4px;
    background:var(--surface-active);color:var(--text2);}
  .chip.on{background:var(--primary-soft);color:var(--primary-deep);}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:24px;}
  @media (max-width:1100px){ .cols{grid-template-columns:1fr;} }
  .panel{
    background:var(--surface);border-radius:16px;padding:20px;
    box-shadow:var(--shadow-sm);border:0.5px solid rgba(28,25,23,0.08);
  }
  .ptitle{font-size:11px;font-weight:500;letter-spacing:0.06em;color:var(--text2);margin-bottom:16px;}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:0.5px solid rgba(28,25,23,0.08);}
  .kv:last-child{border-bottom:none;padding-bottom:0;}
  .k{font-size:12px;color:var(--text2);letter-spacing:0.02em;white-space:nowrap;}
  .v{font-size:14px;color:var(--text);letter-spacing:0.01em;text-align:right;}
  .phone-num{font-size:20px;font-weight:600;letter-spacing:0.02em;}
  .blank{padding:40px;text-align:center;color:var(--text3);font-size:14px;line-height:1.8;
    border:1px dashed var(--border);border-radius:16px;margin-top:24px;}
  .placeholder{margin-top:20px;padding:20px;border:1px dashed var(--border);border-radius:16px;
    font-size:12px;color:var(--text3);line-height:1.8;letter-spacing:0.02em;}

  .slotbar{display:flex;gap:8px;margin-top:16px;}
  .seg{
    flex:1;padding:8px 4px;border:1px solid var(--border);background:var(--surface);
    border-radius:8px;font-family:inherit;font-size:12px;color:var(--text2);cursor:pointer;
    transition:background 120ms,border-color 120ms,color 120ms;letter-spacing:0.02em;
  }
  .seg:hover{background:var(--surface-hover);}
  .seg.on{border-color:var(--primary);color:var(--primary-deep);background:var(--primary-soft);}

  .filterbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .fchip{
    padding:6px 10px;border:1px solid var(--border);background:var(--surface);border-radius:4px;
    font-family:inherit;font-size:12px;color:var(--text2);cursor:pointer;letter-spacing:0.02em;
    transition:background 120ms,border-color 120ms,color 120ms;
  }
  .fchip:hover{background:var(--surface-hover);}
  .fchip.on{border-color:var(--primary);color:var(--primary-deep);background:var(--primary-soft);}

  /* 指で触る端末だけ当たりを大きくする */
  @media (pointer: coarse){
    .item{padding:16px 12px;}
    .nav{padding:14px 12px;}
    .search{height:44px;font-size:16px;}
    .seg{padding:12px 4px;}
    .fchip{padding:10px 12px;}
  }
  /* iPad 縦・狭い画面ではサイドバーを畳む */
  @media (max-width:900px){
    .side{width:64px;padding:24px 8px;}
    .side .brand,.side .nav span,.side .sidenote{display:none;}
    .nav{justify-content:center;padding:12px 0;}
    .list{width:280px;}
    .detail{padding:24px;}
  }
</style>

/* ---- 計算ロジック（保存せず毎回計算する） ---- */

function ymd(s){ const [y,m,d] = s.split('-').map(Number); return {y,m,d}; }

// 年度（4月始まり）
function academicYear(dateStr){
  const {y,m} = ymd(dateStr);
  return y - (m < 4 ? 1 : 0);
}
// 学年コホート（4/1生まれは上の学年）
function cohort(birthStr){
  const {y,m,d} = ymd(birthStr);
  const early = (m < 4) || (m === 4 && d <= 1);
  return y - (early ? 1 : 0);
}
// 学年番号: -2=年少 -1=年中 0=年長 1..6=小 7..9=中 10..12=高
function gradeNum(birthStr, onStr){
  return academicYear(onStr) - cohort(birthStr) - 6;
}
function gradeLabel(birthStr, onStr = TODAY){
  const g = gradeNum(birthStr, onStr);
  if (g <= -3) return '未就園';
  if (g === -2) return '年少';
  if (g === -1) return '年中';
  if (g === 0)  return '年長';
  if (g <= 6)   return '小' + g;
  if (g <= 9)   return '中' + (g - 6);
  if (g <= 12)  return '高' + (g - 9);
  return '一般';
}
// 満年齢
function age(birthStr, onStr = TODAY){
  const b = ymd(birthStr), o = ymd(onStr);
  let a = o.y - b.y;
  if (o.m < b.m || (o.m === b.m && o.d < b.d)) a--;
  return a;
}

const STATUS_LABEL = { trial:'体験', active:'在籍', paused:'休会', withdrawn:'退会' };

/* 同名がいる時だけ「ゆうき（土 15:00）」の形にする */
const NAME_COUNT = {};
STUDENTS.forEach(s => { NAME_COUNT[s.name] = (NAME_COUNT[s.name] || 0) + 1; });

function slotStart(slotIdx){ return SLOT_TIMES[slotIdx].split(' – ')[0]; }
function displayName(s){
  return NAME_COUNT[s.name] > 1
    ? `${s.name}（${DAY_LABEL[s.day]} ${slotStart(s.slot)}）`
    : s.name;
}
function shortSuffix(s){
  return NAME_COUNT[s.name] > 1 ? `${DAY_LABEL[s.day]} ${slotStart(s.slot)}` : '';
}

function byId(id){ return STUDENTS.find(s => s.id === id); }
function todayDay(){ return new Date(TODAY + 'T00:00:00+09:00').getDay(); }
function teacherOf(day, slot){ return DEFAULT_TEACHER[day + '|' + SLOT_TIMES[slot]] || TEACHERS[0]; }
function teacherOfStudent(s){ return teacherOf(s.day, s.slot); }

/* その曜日に実際にある時間帯だけ返す */
function slotsOfDay(day){
  return SLOT_TIMES.map((t, i) => i).filter(i => DEFAULT_TEACHER[day + '|' + SLOT_TIMES[i]]);
}

/* フォルダ分け（絞り込み）。key で1つ選ぶ */
const FILTERS = [
  { key:'all',   label:'ぜんいん' },
  { key:'mine',  label:'自分の担当' },
  { key:'trial', label:'体験' },
].concat(TEACHERS.map(t => ({ key:'t:' + t, label:t })));

function passesFilter(s, key){
  if(key === 'all')   return true;
  if(key === 'mine')  return teacherOfStudent(s) === CURRENT_USER;
  if(key === 'trial') return s.status === 'trial';
  if(key.startsWith('t:')) return teacherOfStudent(s) === key.slice(2);
  return true;
}

  return STUDENTS.filter(s => s.day === DOW && s.slot === slotIdx && s.status !== 'withdrawn');
}
function dateLine(){
  const {m,d} = ymd(TODAY);
  return `${m}月${d}日（${DAY_LABEL[DOW]}）`;
}

function setView(v){
  view = v;
  document.getElementById('navToday').classList.toggle('on', v === 'today');
  document.getElementById('navStudents').classList.toggle('on', v === 'students');
  document.getElementById('q').value = '';
  renderHead();
  renderList();
}

function renderSortBar(){
  const bar = document.getElementById('sortbar');
  bar.style.display = (view === 'students') ? 'flex' : 'none';
  if(view !== 'students') return;
  bar.innerHTML = '';
  SORTS.forEach(s => {
    const b = document.createElement('button');
    b.className = 'seg' + (s.key === sortKey ? ' on' : '');
    b.textContent = s.label;
    b.onclick = () => { sortKey = s.key; renderSortBar(); renderList(); };
    bar.appendChild(b);
  });
}

function renderFilterBar(){
  const bar = document.getElementById('filterbar');
  bar.style.display = (view === 'students') ? 'flex' : 'none';
  if(view !== 'students') return;
  bar.innerHTML = '';
  FILTERS.forEach(f => {
    const b = document.createElement('button');
    b.className = 'fchip' + (f.key === filterKey ? ' on' : '');
    b.textContent = f.key === 'mine' ? `自分の担当（${CURRENT_USER}）` : f.label;
    b.onclick = () => { filterKey = f.key; renderHead(); renderList(); };
    bar.appendChild(b);
  });
}

function renderHead(){
  const bar = document.getElementById('slotbar');
  renderSortBar();
  renderFilterBar();
  if(view === 'today'){
    document.getElementById('ltitle').textContent = '今日';
    document.getElementById('lsub').textContent =
      DAY_SLOTS.length ? dateLine() + '　担当 ' + teacherOf(DOW, curSlot)
                       : dateLine() + '　授業はありません';
    bar.style.display = DAY_SLOTS.length ? 'flex' : 'none';
    bar.innerHTML = '';
    DAY_SLOTS.forEach(i => {
      const b = document.createElement('button');
      b.className = 'seg' + (i === curSlot ? ' on' : '');
      b.textContent = SLOT_TIMES[i].split(' – ')[0];
      b.onclick = () => { curSlot = i; renderHead(); renderList(); };
      bar.appendChild(b);
    });
  }else{
    document.getElementById('ltitle').textContent = '生徒';
    const n = STUDENTS.filter(s => passesFilter(s, filterKey)).length;
    const f = FILTERS.find(x => x.key === filterKey);
    document.getElementById('lsub').textContent =
      filterKey === 'all' ? `${STUDENTS.filter(s => s.status === 'active').length}人 在籍中`
                          : `${f.label}　${n}人`;
    bar.style.display = 'none';
  }
}

function renderList(){
  const q = document.getElementById('q').value.trim();
  const el = document.getElementById('listBody');
  el.innerHTML = '';

  let rows;
  if(view === 'today'){
    if(!DAY_SLOTS.length){
      el.innerHTML = '<div class="empty">今日は授業がありません<br>左の「生徒」から名簿は見られます</div>';
      return;
    }
    rows = todayMembers(curSlot).filter(s => !q || s.name.includes(q));
  }else{
    rows = STUDENTS.filter(s => passesFilter(s, filterKey) && (!q || s.name.includes(q)));
  }
  if(!rows.length){ el.innerHTML = '<div class="empty">いません</div>'; return; }

  if(view === 'students'){
    const byName = (a,b) => a.name.localeCompare(b.name, 'ja');
    const groups = [];
    const push = (label, s) => {
      const last = groups[groups.length - 1];
      if(last && last.label === label) last.rows.push(s);
      else groups.push({ label, rows:[s] });
    };
    if(sortKey === 'day'){
      rows.slice().sort((a,b) => a.day - b.day || a.slot - b.slot || byName(a,b))
          .forEach(s => push(DAY_LABEL[s.day] + '曜', s));
    }else if(sortKey === 'grade'){
      rows.slice().sort((a,b) => gradeNum(a.birth, TODAY) - gradeNum(b.birth, TODAY) || byName(a,b))
          .forEach(s => push(gradeLabel(s.birth), s));
    }else{
      rows.slice().sort((a,b) => age(a.birth) - age(b.birth) || byName(a,b))
          .forEach(s => push(age(s.birth) + 'さい', s));
    }
    groups.forEach(g => {
      const h = document.createElement('div');
      h.className = 'group';
      h.textContent = g.label;
      el.appendChild(h);
      g.rows.forEach(s => el.appendChild(itemEl(s)));
    });
  }else{
    rows.forEach(s => el.appendChild(itemEl(s)));
  }
}

function itemEl(s){
  const b = document.createElement('button');
  b.className = 'item' + (s.id === curStudent ? ' on' : '');
  b.onclick = () => { curStudent = s.id; renderList(); renderDetail(); };
  const tag = s.status !== 'active' ? `<span class="tag">${STATUS_LABEL[s.status]}</span>` : '';
  const meta = view === 'today'
    ? `${gradeLabel(s.birth)}・${age(s.birth)}さい`
    : `${gradeLabel(s.birth)}・${age(s.birth)}さい　${sortKey === 'day' ? '' : DAY_LABEL[s.day] + '曜 '}${SLOT_TIMES[s.slot]}　${teacherOfStudent(s)}`;
  b.innerHTML = `
    <div>
      <div class="iname">${view === 'today' ? s.name : displayName(s)}</div>
      <div class="imeta">${meta}</div>
    </div>${tag}`;
  return b;
}

function renderDetail(){
  const el = document.getElementById('detail');
  if(!curStudent){
    el.innerHTML = '<div class="blank">左から生徒を選ぶと<br>ここに情報が出ます</div>';
    return;
  }
  const s = byId(curStudent);
  el.innerHTML = `
    <div class="dwrap">
      <div class="name-big">${s.name}</div>
      <div class="name-sub">${DAY_LABEL[s.day]}曜 ${SLOT_TIMES[s.slot]}　担当 ${teacherOfStudent(s)}</div>
      <div class="chips">
        <span class="chip on">${gradeLabel(s.birth)}</span>
        <span class="chip on">${age(s.birth)}さい</span>
        <span class="chip">${STATUS_LABEL[s.status]}</span>
      </div>

      <div class="cols">
        <div class="panel">
          <div class="ptitle">きほん じょうほう</div>
          <div class="kv"><span class="k">なまえ</span><span class="v">${s.name}</span></div>
          <div class="kv"><span class="k">生年月日</span><span class="v">${s.birth.replace(/-/g,'/')}</span></div>
          <div class="kv"><span class="k">学年</span><span class="v">${gradeLabel(s.birth)}</span></div>
          <div class="kv"><span class="k">年齢</span><span class="v">${age(s.birth)}さい</span></div>
          <div class="kv"><span class="k">入会日</span><span class="v">${s.joined ? s.joined.replace(/-/g,'/') : 'まだ（体験）'}</span></div>
          <div class="kv"><span class="k">通っている枠</span><span class="v">${DAY_LABEL[s.day]}曜 ${SLOT_TIMES[s.slot]}</span></div>
        </div>

        <div class="panel">
          <div class="ptitle">ほごしゃ れんらくさき</div>
          <div class="kv"><span class="k">お名前</span><span class="v">${s.guardian}</span></div>
          <div class="kv"><span class="k">電話</span><span class="v phone-num">${s.phone}</span></div>
          <div class="kv"><span class="k">在籍</span><span class="v">${STATUS_LABEL[s.status]}</span></div>
        </div>
      </div>

      <div class="placeholder">
        このあとここに入る予定：扱い方説明書 ／ 技の時系列（苦戦メモ→練習法→合格） ／ 写真・動画のタイムライン<br>
        まだ作っていません。順番は海翔が決める
      </div>
    </div>`;
}

setView('today');
renderDetail();
</script>
</body>
</html>
